<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header class="header">
        <div class="logo-box">
    <img src="/img/logo.png" alt="Samsung" style="display: block; height: 40px;">
    
    <span class="status-beacon"></span>
</div>
        <nav>
            <a href="#">Analytics</a>

            <div class="nav-dropdown">
                <a href="#" class="nav-trigger">System ▾</a>
                <div class="dropdown-menu">
                    <a href="#">Configurações</a>
                    <a href="#">Usuários</a>
                    <a href="#">Relatórios</a>
                    <a href="#">Segurança</a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero-section">
            <div class="ambient-glow"></div>
            
            <div class="hero-card">
                <div class="water-container">
                    <div class="drop-wave"></div>
                    <div class="drop-wave"></div>
                    <div class="drop-wave"></div>
                </div>

                <h1>
                    <span class="wave-text-anim">Samsung</span>
                     Logistic Customer Connect
                </h1>
                
                <p>Samsung Customer Connect connects Samsung with its customers</p>
                
                <button class="btn-cyber-glass">
                    <span class="btn-text">Iniciar Conexão</span>
                    <span class="btn-shimmer"></span>
                </button>
                
            </div>
        </section>

        <div class="dashboard-grid">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">QUALIDADE</span>
                    <span class="card-icon">⌂</span>
                </div>
                <div class="card-value">0%</div>
                <div class="card-sub">
                    <span>↑</span> 0% este mês
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">LOGÍSTICA</span>
                    <span class="card-icon">⌂</span>
                </div>
                <div class="card-value">0%</div>
                <div class="card-sub">Estável</div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">OPERAÇÃO</span>
                    <span class="card-icon">⌂</span>
                </div>
                <div class="card-value">0%</div>
                <div class="card-sub">Estável</div>
            </div>
        </div>
    </main>
</div>

<script>
    // Script simples para o menu dropdown
    document.addEventListener("DOMContentLoaded", () => {
        const trigger = document.querySelector(".nav-trigger");
        const dropdown = document.querySelector(".dropdown-menu");
        const dropdownContainer = document.querySelector(".nav-dropdown");

        trigger.addEventListener("click", (e) => {
            e.preventDefault();
            dropdown.classList.toggle("open");
            trigger.classList.toggle("active");
        });

        document.addEventListener("click", (e) => {
            if (!dropdownContainer.contains(e.target)) {
                dropdown.classList.remove("open");
                trigger.classList.remove("active");
            }
        });
    });
</script>

</body>
</html>
