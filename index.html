<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung Customer Connect - Premium Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <header>
        <div class="logo-box">
            <img src="logo.png" alt="Samsung Logo">
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Analytics</a>
            <a href="#">System</a>
            <a href="#" class="user-badge">Login</a>
        </nav>
    </header>

    <main>
        <section class="hero-card">
            <h1>Samsung <b>Customer Connect</b></h1>
            <p>Texto</p>
            <button class="btn-main">Iniciar Conexão</button>
        </section>

        <div class="dashboard-grid">
            <div class="card">
                <div class="card-label">QUALIDADE</div>
                <div class="card-value">0%</div>
                <div class="card-sub"><span>↑</span> 0% este mês</div>
            </div>

            <div class="card">
                <div class="card-label">LOGÍSTICA</div>
                <div class="card-value">0%</div>
                <div class="card-sub" style="color:var(--text-dim)">Estável</div>
            </div>

            <div class="card">
                <div class="card-label">EQUIPE</div>
                <div style="margin-top:20px">
                    <div class="team-item"><span>Digital</span> <strong>0%</strong></div>
                    <div class="team-item"><span>Retenção</span> <strong>0%</strong></div>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
