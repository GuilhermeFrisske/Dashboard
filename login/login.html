<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Samsung Connect</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-body">

    <div class="login-wrapper">
        <div class="login-glow-bg"></div>

        <div class="login-card glass-panel">
            
            <div class="login-header">
                <div class="logo-box justify-center">
                    <img src="/img/logo.png" alt="Samsung" style="height: 40px;">
                    <span class="status-beacon"></span>
                </div>
                <h2>Welcome back</h2>
                <p>Access the global logistics dashboard</p>
            </div>

            <form class="login-form">
                
                <div class="input-group">
                    <label>Corporate Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" placeholder="user@samsung.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-actions">
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                    <a href="#" class="forgot-link">Recover password</a>
                </div>

                <button type="submit" class="btn-cyber-glass full-width">
                    <span class="btn-text">Access System</span>
                    <span class="btn-shimmer"></span>
                </button>

            </form>

            <div class="login-footer">
                <p>© 2024 Samsung Logistics. Secured by Knox.</p>
            </div>
        </div>
    </div>

</body>
</html>
