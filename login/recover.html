<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Samsung Connect</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="recover.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-body">

    <div class="login-wrapper">
        <div class="login-glow-bg"></div>

        <div class="glass-panel">
            
            <div class="login-header">
                <div class="logo-box justify-center">
                    <img src="/img/logo.png" alt="Samsung" style="height: 40px;">
                    <span class="status-beacon"></span>
                </div>
                <h2>Reset Password</h2>
                <p>Enter your registered email to receive a reset link</p>
            </div>

            <form class="login-form">
                
                <div class="input-group">
                    <label>Corporate Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" placeholder="user@samsung.com" required>
                    </div>
                </div>

                <button type="submit" class="btn-cyber-glass full-width">
                    <span class="btn-text">Send Reset Link</span>
                    <span class="btn-shimmer"></span>
                </button>

            </form>

            <div class="recovery-footer">
                <a href="login.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </div>
            
        </div>
    </div>

</body>
</html>
